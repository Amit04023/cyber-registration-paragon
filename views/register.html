<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הרשמה</title>

  <style>
	  * {
	  box-sizing: border-box;
	}
    body {
      margin: 0;
      padding: 35px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #f97316;
      padding: 35px;
      border-radius: 20px;
      width: 420px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h2 {
      color: #fff;
      margin-bottom: 10px;
    }

    p {
      color: #fff;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #111;
    }

    small {
      display: block;
      margin-top: 10px;
      color: #eee;
    }
  </style>
</head>

<body>

<div class="box">
	<img src="/logo1.png" alt="logo" style="width:80px; margin-bottom:15px;">
	  <h2>זו הייתה סימולציית סייבר של Paragon</h2>

  <p>
    בדיוק כך נראים ניסיונות פישינג והתחזות.  
    נשמח אם תשאיר פרטים להרצאת מודעות סייבר.
  </p>

  <form method="POST" action="/register">

    <input type="text" name="full_name" placeholder="שם מלא" required>
    <input type="text" name="company" placeholder="מחלקה">
    <input type="text" name="phone" placeholder="טלפון">
    <input type="email" name="email" placeholder="אימייל" required>

    <!-- 🔥 חשוב מאוד -->
    <input type="hidden" name="token" id="token">

    <button type="submit">אישור הגעה להרצאה</button>

  </form>

  <small>לא נאספו סיסמאות או פרטים רגישים.</small>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("token").value = params.get("u") || "";
</script>

</body>
</html>
