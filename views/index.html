<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Security Awareness</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      color: #00ff88;
      font-family: Consolas, monospace;
      overflow: hidden;
    }

    .screen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .box {
      max-width: 850px;
      width: 100%;
      border: 1px solid #00ff88;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0,255,136,0.25);
      background: rgba(0,0,0,0.75);
    }

    #text {
      font-size: 22px;
      line-height: 1.8;
      white-space: pre-line;
      min-height: 260px;
    }

    .danger {
      color: #ff3b3b;
    }

    .hidden {
      display: none;
    }

    .btn {
      margin-top: 25px;
      padding: 14px 28px;
      border: none;
      background: #00ff88;
      color: #000;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }

    .btn:hover {
      background: #00cc6a;
    }
  </style>
</head>
<body>

<div class="screen">
  <div class="box">
    <div id="text"></div>

    <button id="continueBtn" class="btn hidden" onclick="goToRegister()">
      המשך להרשמה
    </button>
  </div>
</div>

<script>
  const message = `
בודק קישור...
מזהה פרטי דפדפן...
מזהה כתובת IP...
בודק הרשאות משתמש...

אזהרה: לחיצה על קישורים לא מזוהים עלולה לחשוף מידע ארגוני.

זה היה תרגיל מודעות סייבר.
לא נאסף מידע רגיש ולא נגנבו פרטים.

כדי להשלים את התרגיל, המשך לעמוד ההרשמה.
`;

  const textEl = document.getElementById("text");
  const btn = document.getElementById("continueBtn");

  let i = 0;

  function typeText() {
    if (i < message.length) {
      textEl.innerHTML += message.charAt(i);
      i++;
      setTimeout(typeText, 45);
    } else {
      btn.classList.remove("hidden");
    }
  }

  function goToRegister() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("u") || "";
    window.location.href = "/register-page?u=" + encodeURIComponent(token);
  }

  typeText();
</script>

</body>
</html>
